services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pocketpilot
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pocketpilot']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pocketpilot-postgres:/var/lib/postgresql/data

volumes:
  pocketpilot-postgres:
